name: APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Outils de compilation
        run: |
          pip install --quiet pillow
          ./tools/installer-outils.sh

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/flammesnap.jks"
            echo "KEYSTORE=$RUNNER_TEMP/flammesnap.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Aucune clé de signature dans les secrets : une clé temporaire est créée pour ce build."
            echo "KEYSTORE=$RUNNER_TEMP/temporaire.jks" >> "$GITHUB_ENV"
          fi

      - name: Construire l'APK
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'cle-temporaire' }}
        run: |
          ./build.sh
          V=$(grep -o 'versionName="[^"]*"' app/AndroidManifest.xml | cut -d'"' -f2)
          cp build/FlammeSnap.apk "FlammeSnap-$V.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: FlammeSnap-apk
          path: FlammeSnap-*.apk

      - name: Publier la version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          NOTES="docs/notes/$TAG.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" FlammeSnap-*.apk --clobber
          else
            gh release create "$TAG" FlammeSnap-*.apk --title "Flamme Snap ${TAG#v}" --notes-file "$NOTES"
          fi
